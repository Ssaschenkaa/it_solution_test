{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Новая транзакция</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <h2 class="mb-4">Создание записи</h2>
      <form method="post">
        {% csrf_token %} {{ form.as_p }}

        <a href="{% url 'cashflow_list' %}" class="btn btn-secondary">Отмена</a>
      </form>
    </div>
  </body>
</html>
