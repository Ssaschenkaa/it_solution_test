{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Управление справочниками</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center">
        <h2>Управление справочниками</h2>
        <a href="{% url 'cashflow_list' %}" class="btn btn-secondary"
          >На главную</a
        >
      </div>

      <ul class="nav nav-tabs mt-4 mb-3">
        <li class="nav-item">
          <a
            class="nav-link {% if tab == 'status' %}active{% endif %}"
            href="?tab=status"
            >Статусы</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if tab == 'type' %}active{% endif %}"
            href="?tab=type"
            >Типы</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if tab == 'category' %}active{% endif %}"
            href="?tab=category"
            >Категории</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if tab == 'subcategory' %}active{% endif %}"
            href="?tab=subcategory"
            >Подкатегории</a
          >
        </li>
      </ul>

      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button class="btn btn-success">Добавить / Сохранить</button>
      </form>

      <table class="table mt-4">
        <thead>
          <tr>
            <th>Название</th>
            <th>Слаг</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          {% for item in object_list %}
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.slug }}</td>
            <td>
              <a
                href="?tab={{ tab }}&edit={{ item.id }}"
                class="btn btn-sm btn-primary"
                >Редактировать</a
              >
              <a
                href="?tab={{ tab }}&delete={{ item.id }}"
                class="btn btn-sm btn-danger"
                >Удалить</a
              >
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
